<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Doors Testing</title>
    <meta name="description" content="Video - A-Frame" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-template-component@3.x.x/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.x.x/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.jss"></script>
    <!-- <script src="https://unpkg.com/aframe-animation-component@5.x.x/dist/aframe-animation-component.min.js"></script> -->
    <!-- <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script> -->

    <link rel="stylesheet" href="../css/doors.css" />

    <script src="../js/play-on-click.js"></script>
    <script src="../js/hide-on-play.js"></script>
    <script src="../js/hotspots.js?v=20261019-oct19-models"></script>

    <script id="link" type="text/html">
      <a-entity
        class="link"
        geometry="primitive: circle; height: 0.2; width: 0.2"
        material="shader: flat; src: ${thumb}"
        sound="on: click; src: #click-sound"
        event-set__mouseenter="scale: 1.2 1.2 1.2"
        event-set__mouseleave="scale: .5 .5 .5"
        event-set__click="_target: #video-sphere; _delay: 300; material.src: ${src}"
      >
      </a-entity>
    </script>
  </head>

  <body>
    <div id="ui-overlay">
      <div id="space-title" role="status" aria-live="polite">Entrance</div>
      <div id="season-control">
        <label for="season-select">Season</label>
        <select id="season-select" aria-label="Choose a season">
          <option value="winter">Winter</option>
          <option value="spring">Spring</option>
          <option value="summer">Summer</option>
        </select>
      </div>
      <output id="direction-debug" aria-label="Viewing direction" hidden></output>
      <button id="mute-button" type="button" aria-label="Mute audio" aria-pressed="false" title="Mute audio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4Z" />
          <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14" />
          <path class="sound-off" d="m16 9 6 6m0-6-6 6" />
        </svg>
      </button>
      <button
        id="info-button"
        type="button"
        aria-label="About Entrance"
        aria-controls="info-panel"
        aria-expanded="false"
      >
        <span aria-hidden="true">i</span>
      </button>
      <div id="info-panel-backdrop" hidden>
        <section
          id="info-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="info-panel-heading"
          aria-describedby="info-panel-description"
        >
          <button id="info-close" type="button" aria-label="Close information">
            <span aria-hidden="true">&times;</span>
          </button>
          <p id="info-panel-eyebrow">About this place</p>
          <h2 id="info-panel-heading">Entrance</h2>
          <p id="info-panel-description"></p>
        </section>
      </div>
    </div>
    <div id="sphere-transition" aria-hidden="true"></div>
    <a-scene>
      <a-assets>
        <audio
          id="click-sound"
          src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"
        ></audio>
        <audio
          id="concat"
          src="../media/audio/Concat of 0120am Dec-Jan.wav"
        ></audio>
        <audio
          id="duet"
          src="../media/audio/duet for car and hills no NORM.wav"
        ></audio>
        <audio
          id="solstice"
          src="../media/audio/Solstice Coyotes 44.wav"
        ></audio>

        <video
          id="entrance"
          preload="auto"
          src="../media/winter/01_Entrance_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="funnel"
          preload="auto"
          src="../media/winter/02_Funnel_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="heart"
          preload="auto"
          src="../media/winter/03_Heart_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="lookout"
          preload="auto"
          src="../media/winter/04_Lookout_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="bottoms"
          preload="auto"
          src="../media/winter/05_Bottoms_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="spring-entrance"
          preload="none"
          src="../media/spring/Beltane Stitches/1_Entrance Beltane.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="spring-funnel"
          preload="none"
          src="../media/spring/Beltane Stitches/2_Funnel Beltane.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="spring-heart"
          preload="none"
          src="../media/spring/Beltane Stitches/4_Heart Beltane.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="spring-lookout"
          preload="none"
          src="../media/spring/Beltane Stitches/3_Lookout Beltane.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="spring-bottoms"
          preload="none"
          src="../media/spring/Beltane Stitches/5_Bottoms Beltane.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="summer-entrance"
          preload="none"
          src="../media/summer/1-Entry_Spring-4k.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="summer-funnel"
          preload="none"
          src="../media/summer/2-Funnel_Spring-4k.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="summer-heart"
          preload="none"
          src="../media/summer/4-Heart_Spring-4k.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="summer-lookout"
          preload="none"
          src="../media/summer/3-Lookout_Spring-4k.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
        <video
          id="summer-bottoms"
          preload="none"
          src="../media/summer/5-Bottoms_Spring-4k.mp4"
          muted
          loop
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-videosphere
        src="#entrance"
        id="video-sphere"
        radius="500"
        position="0 0 0"
        rotation="0 -90 0"
      >
      </a-videosphere>

      <!-- Camera + Cursor. -->
      <a-camera wasd-controls-enabled="false" look-controls>
        <!-- Use mouse rayOrigin for desktop pointer input (invisible entity). This enables mouse hover/click events on entities instead of the VR reticle. -->
        <a-entity
          cursor="rayOrigin: mouse; fuse: false"
          raycaster="objects: .clickable"
        ></a-entity>
      </a-camera>
    </a-scene>

    <script>
      // Auto-play entrance video when scene loads
      document.addEventListener("DOMContentLoaded", function () {
        // setTimeout(function () {
        //   var entranceVideo = document.getElementById("entrance");
        //   if (entranceVideo) {
        //     entranceVideo.play().catch(function (error) {

        //     });
        //   }
        // }, 500);
      });
    </script>
  </body>
</html>
