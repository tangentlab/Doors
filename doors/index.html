    <style>
      /*
       * A soft, inward-closing iris used while changing 360 spaces. Keeping this
       * outside the WebGL canvas makes it stable while the camera is moving.
       */
      #sphere-transition {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
      }

      #sphere-transition::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #050607;
        -webkit-mask-image: radial-gradient(
          circle at center,
          transparent 0,
          transparent var(--iris-inner, 73vmax),
          #000 var(--iris-outer, 76vmax)
        );
        mask-image: radial-gradient(
          circle at center,
          transparent 0,
          transparent var(--iris-inner, 73vmax),
          #000 var(--iris-outer, 76vmax)
        );
        will-change: --iris-inner, --iris-outer;
      }

      #sphere-transition.is-active {
        opacity: 1;
      }

      @property --iris-inner {
        syntax: "<length>";
        inherits: false;
        initial-value: 73vmax;
      }

      @property --iris-outer {
        syntax: "<length>";
        inherits: false;
        initial-value: 76vmax;
      }

      #sphere-transition.is-active::before {
        animation: sphere-iris 780ms cubic-bezier(0.65, 0, 0.35, 1) both;
      }

      /* The short hold at full coverage gives the transition its blink. */
      @keyframes sphere-iris {
        0% {
          --iris-inner: 73vmax;
          --iris-outer: 76vmax;
        }
        46%,
        56% {
          --iris-inner: 0vmax;
          --iris-outer: 0vmax;
        }
        100% {
          --iris-inner: 73vmax;
          --iris-outer: 76vmax;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #sphere-transition.is-active::before {
          animation-duration: 160ms;
        }
      }
    </style>

    <script src="../js/play-on-click.js"></script>
    <script src="../js/hide-on-play.js"></script>
    <script src="../js/hotspots.js"></script>

    <script id="link" type="text/html">
      <a-entity
        class="link"
        geometry="primitive: circle; height: 0.2; width: 0.2"
        material="shader: flat; src: ${thumb}"
        sound="on: click; src: #click-sound"
        event-set__mouseenter="scale: 1.2 1.2 1.2"
        event-set__mouseleave="scale: .5 .5 .5"
        event-set__click="_target: #video-sphere; _delay: 300; material.src: ${src}"
      >
      </a-entity>
    </script>
  </head>

  <body>
    <div id="sphere-transition" aria-hidden="true"></div>
    <a-scene>
      <a-assets>
        <audio
          id="click-sound"
          src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"
        ></audio>
        <audio
          id="concat"
          src="../media/audio/Concat of 0120am Dec-Jan.wav"
        ></audio>
        <audio
          id="duet"
          src="../media/audio/duet for car and hills no NORM.wav"
        ></audio>
        <audio
          id="solstice"
          src="../media/audio/Solstice Coyotes 44.wav"
        ></audio>

        <video
          id="entrance"
          preload="auto"
          src="../media/winter/01_Entrance_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="funnel"
          preload="auto"
          src="../media/winter/02_Funnel_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="heart"
          preload="auto"
          src="../media/winter/03_Heart_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="lookout"
          preload="auto"
          src="../media/winter/04_Lookout_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="bottoms"
          preload="auto"
          src="../media/winter/05_Bottoms_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-videosphere
        src="#entrance"
        id="video-sphere"
        radius="500"
        position="0 0 0"
        rotation="0 -90 0"
      >
      </a-videosphere>

      <!-- Camera + Cursor. -->
      <a-camera wasd-controls-enabled="false" look-controls>
        <!-- Use mouse rayOrigin for desktop pointer input (invisible entity). This enables mouse hover/click events on entities instead of the VR reticle. -->
        <a-entity cursor="rayOrigin: mouse; fuse: false"></a-entity>
      </a-camera>
    </a-scene>
