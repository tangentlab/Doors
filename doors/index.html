    <style>
      /*
       * A soft, inward-closing iris used while changing 360 spaces. Keeping this
       * outside the WebGL canvas makes it stable while the camera is moving.
       */
      #sphere-transition {
        /* Increase this for a softer, wider fade edge. */
        --sphere-transition-feather: 100vmax;
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
      }

      #sphere-transition::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #050607;
        -webkit-mask-image: radial-gradient(
          circle at center,
          transparent 0,
          transparent var(--iris-inner, 73vmax),
          #000 calc(var(--iris-inner, 73vmax) + var(--iris-feather, 14vmax))
        );
        mask-image: radial-gradient(
          circle at center,
          transparent 0,
          transparent var(--iris-inner, 73vmax),
          #000 calc(var(--iris-inner, 73vmax) + var(--iris-feather, 14vmax))
        );
        will-change: --iris-inner, --iris-feather;
      }

      #sphere-transition.is-active {
        opacity: 1;
      }

      @property --iris-inner {
        syntax: "<length>";
        inherits: false;
        initial-value: 73vmax;
      }

      @property --iris-feather {
        syntax: "<length>";
        inherits: false;
        initial-value: 14vmax;
      }

      #sphere-transition.is-active::before {
        animation: sphere-iris var(--sphere-transition-duration, 1200ms)
          cubic-bezier(0.65, 0, 0.35, 1) both;
      }

      /* The short hold at full coverage gives the transition its blink. */
      @keyframes sphere-iris {
        0% {
          --iris-inner: 73vmax;
          --iris-feather: var(--sphere-transition-feather);
        }
        46%,
        56% {
          --iris-inner: 0vmax;
          --iris-feather: 0vmax;
        }
        100% {
          --iris-inner: 73vmax;
          --iris-feather: var(--sphere-transition-feather);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #sphere-transition.is-active::before {
          animation-duration: 160ms;
        }
      }

      #ui-overlay {
        position: fixed !important;
        inset: 0;
        z-index: 2147483647;
        pointer-events: none;
      }

      #space-title {
        position: absolute;
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
        margin: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 0.25rem;
        background: rgba(5, 6, 7, 0.68);
        color: #fff;
        font: 600 0.875rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #info-button {
        position: absolute;
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
        display: inline-flex;
        width: 2.75rem;
        height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        background: rgba(5, 6, 7, 0.72);
        color: #fff;
        cursor: pointer;
        font: 600 1.15rem/1 Georgia, serif;
        pointer-events: auto;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      #info-button:hover {
        border-color: #d6deae;
        background: rgba(38, 47, 38, 0.92);
        transform: scale(1.05);
      }

      #info-button:focus-visible,
      #info-close:focus-visible {
        outline: 3px solid #d6deae;
        outline-offset: 3px;
      }

      #info-panel-backdrop {
        position: absolute;
        inset: 0;
        display: grid;
        align-items: center;
        justify-items: end;
        padding: 1rem;
        background: rgba(2, 4, 3, 0.42);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      #info-panel-backdrop.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      #info-panel {
        position: relative;
        width: min(25rem, 100%);
        max-height: calc(100vh - 2rem);
        padding: 1.5rem;
        overflow-y: auto;
        border: 1px solid rgba(214, 222, 174, 0.5);
        border-radius: 0.75rem;
        background: rgba(12, 17, 13, 0.94);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.45);
        color: #f3f1e9;
        transform: translateX(1rem);
        transition: transform 180ms ease;
      }

      #info-panel-backdrop.is-open #info-panel {
        transform: translateX(0);
      }

      #info-panel-heading {
        margin: 0.35rem 2.5rem 0.75rem 0;
        font: 400 2rem/1.05 Georgia, "Times New Roman", serif;
      }

      #info-panel-eyebrow {
        margin: 0;
        color: #d6deae;
        font: 600 0.68rem/1.2 system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      #info-panel-description {
        margin: 0;
        color: #d2d2c7;
        font: 400 0.95rem/1.65 system-ui, sans-serif;
      }

      #info-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #f3f1e9;
        cursor: pointer;
        font: 300 1.6rem/1 system-ui, sans-serif;
      }

      @media (max-width: 35rem) {
        #info-panel-backdrop {
          align-items: end;
        }

        #info-panel {
          width: 100%;
          max-height: 70vh;
          transform: translateY(1rem);
        }

        #info-panel-backdrop.is-open #info-panel {
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #info-button,
        #info-panel,
        #info-panel-backdrop {
          transition: none;
        }
      }

    </style>

    <script src="../js/play-on-click.js"></script>
    <script src="../js/hide-on-play.js"></script>
    <script src="../js/hotspots.js?v=20260731-poi-render-order"></script>

    <script id="link" type="text/html">
      <a-entity
        class="link"
        geometry="primitive: circle; height: 0.2; width: 0.2"
        material="shader: flat; src: ${thumb}"
        sound="on: click; src: #click-sound"
        event-set__mouseenter="scale: 1.2 1.2 1.2"
        event-set__mouseleave="scale: .5 .5 .5"
        event-set__click="_target: #video-sphere; _delay: 300; material.src: ${src}"
      >
      </a-entity>
    </script>
  </head>

  <body>
    <div id="ui-overlay">
      <div id="space-title" role="status" aria-live="polite">Entrance</div>
      <button
        id="info-button"
        type="button"
        aria-label="About Entrance"
        aria-controls="info-panel"
        aria-expanded="false"
      >
        <span aria-hidden="true">i</span>
      </button>
      <div id="info-panel-backdrop" hidden>
        <section
          id="info-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="info-panel-heading"
          aria-describedby="info-panel-description"
        >
          <button id="info-close" type="button" aria-label="Close information">
            <span aria-hidden="true">&times;</span>
          </button>
          <p id="info-panel-eyebrow">About this place</p>
          <h2 id="info-panel-heading">Entrance</h2>
          <p id="info-panel-description"></p>
        </section>
      </div>
    </div>
    <div id="sphere-transition" aria-hidden="true"></div>
    <a-scene>
      <a-assets>
        <audio
          id="click-sound"
          src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"
        ></audio>
        <audio
          id="concat"
          src="../media/audio/Concat of 0120am Dec-Jan.wav"
        ></audio>
        <audio
          id="duet"
          src="../media/audio/duet for car and hills no NORM.wav"
        ></audio>
        <audio
          id="solstice"
          src="../media/audio/Solstice Coyotes 44.wav"
        ></audio>

        <video
          id="entrance"
          preload="auto"
          src="../media/winter/01_Entrance_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="funnel"
          preload="auto"
          src="../media/winter/02_Funnel_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="heart"
          preload="auto"
          src="../media/winter/03_Heart_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="lookout"
          preload="auto"
          src="../media/winter/04_Lookout_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
        <video
          id="bottoms"
          preload="auto"
          src="../media/winter/05_Bottoms_11-25.mp4"
          width="160"
          height="90"
          autoplay
          muted
          loop
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-videosphere
        src="#entrance"
        id="video-sphere"
        radius="500"
        position="0 0 0"
        rotation="0 -90 0"
      >
      </a-videosphere>

      <!-- Camera + Cursor. -->
      <a-camera wasd-controls-enabled="false" look-controls>
        <!-- Use mouse rayOrigin for desktop pointer input (invisible entity). This enables mouse hover/click events on entities instead of the VR reticle. -->
        <a-entity
          cursor="rayOrigin: mouse; fuse: false"
          raycaster="objects: .clickable"
        ></a-entity>
      </a-camera>
    </a-scene>
