<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrance • depth experiment</title>
<style>body{margin:0;background:#121819;color:#eef3ee;font:15px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}aside{position:fixed;top:20px;left:20px;background:#182324ed;padding:20px;border-radius:12px;max-width:330px}h1{font-size:20px;margin:0 0 8px}p{line-height:1.5;color:#c4d0c9}label{display:block;margin:10px 0}button,a{color:inherit}button{background:#324b46;border:0;border-radius:5px;padding:8px 14px;cursor:pointer}input{vertical-align:middle}small{color:#aec4bb}@media(max-width:600px){aside{top:auto;bottom:10px;left:10px;right:10px;max-width:none;padding:12px;font-size:12px}aside p{margin:6px 0}h1{font-size:16px}}</style>
<canvas aria-label="Interactive inferred point cloud"></canvas><aside><h1>Winter entrance</h1><p>Drag to look around. Use the slider to move sideways and inspect parallax.</p><label>Sideways <input id="shift" type="range" min="-0.12" max="0.12" step="0.002" value="0"></label><label>Point size <input id="size" type="range" min="1" max="6" step="0.5" value="4"></label><button id="reset">Reset view</button><p><small>Single-frame AI depth. Relative scale, not measured distances. Sky and tripod are included; gaps and stretched geometry are expected.</small></p><small id="status">Loading point cloud…</small><p><a href="entrance.ply" download>Download PLY</a> · <a href="depth-preview.png">Depth map</a></p></aside>
<script>
(async()=>{const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),gl=canvas.getContext('webgl');try{if(!gl)throw Error('WebGL is unavailable');
const vs=`attribute vec3 pos;attribute vec3 rgb;uniform float yaw,pitch,shift,aspect,pointSize,scale;varying vec3 color;void main(){vec3 p=pos/scale-vec3(shift,0.,0.);float c=cos(yaw),s=sin(yaw);p=vec3(c*p.x-s*p.z,p.y,s*p.x+c*p.z);c=cos(pitch);s=sin(pitch);p=vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);float near=.001;float far=1000.;gl_Position=vec4(p.x/aspect,p.y,(-(far+near)*p.z-2.*far*near)/(far-near),-p.z);gl_PointSize=pointSize;color=rgb;}`;
const fs=`precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.);}`;
function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const [response,metaResponse]=await Promise.all([fetch('points.bin'),fetch('result.json')]);if(!response.ok||!metaResponse.ok)throw Error('Point cloud files could not be loaded');const data=new Float32Array(await response.arrayBuffer()),meta=await metaResponse.json();gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);for(const [name,offset] of [['pos',0],['rgb',12]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,offset);}
const uniforms={};for(const name of ['yaw','pitch','shift','aspect','pointSize','scale'])uniforms[name]=gl.getUniformLocation(program,name);let yaw=0,pitch=0,drag=null;const shift=document.querySelector('#shift'),size=document.querySelector('#size');
function draw(){const dpr=Math.min(devicePixelRatio,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.055,.075,.08,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);for(const [key,value] of Object.entries({yaw,pitch,shift:+shift.value,aspect:canvas.width/canvas.height,pointSize:+size.value*dpr,scale:meta.distance_median}))gl.uniform1f(uniforms[key],value);gl.drawArrays(gl.POINTS,0,data.length/6);}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.004;pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];draw()};shift.oninput=size.oninput=draw;document.querySelector('#reset').onclick=()=>{yaw=pitch=0;shift.value=0;draw()};onresize=draw;draw();status.textContent=`${(data.length/6).toLocaleString()} preview points • DA²`;
}catch(error){status.textContent=error.message;console.error(error)}})();
</script></html>
